# Render Blueprint: the whole app (pages + API) as one free Docker web service.
# Database and video storage live on Supabase (free plan), see README section 13.
#
# Secrets are NOT in this file. The `sync: false` values are typed once in the Render dashboard.
services:
  - type: web
    name: tarmoq-uz
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # A static page that does not touch the database, so a paused database never marks the service unhealthy.
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # Signs session cookies. Render generates a long random value; nobody ever sees it.
      - key: AUTH_SECRET
        generateValue: true
      # Encrypts creators' payout card numbers: 32 random bytes, base64 (openssl rand -base64 32). Required before the first
      # card is saved on the live site (without it the app refuses to store one). Set it ONCE and keep it: changing it later
      # makes saved cards unreadable. It is deliberately separate from AUTH_SECRET.
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false
      # Supabase "Session pooler" connection string (IPv4, port 5432), with the database password.
      - key: DATABASE_URL
        sync: false
      # Supabase Storage > S3 connection > access keys.
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Optional: Telegram alert to the admin when a creator submits a profile (README section 9). Empty = off.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        value: https://gkigkiqzcdjfbysymaur.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: eu-central-1
      - key: S3_BUCKET
        value: deliveries
      # Clients' bank receipts (JPG, PNG, WebP, PDF up to 5 MB) go to their own private bucket; videos stay in S3_BUCKET.
      - key: S3_RECEIPTS_BUCKET
        value: receipts
      # Profile photos (JPG, PNG, WebP up to 2 MB) have their own private bucket. Create it in Supabase Storage before this goes live.
      - key: S3_AVATARS_BUCKET
        value: avatars
      # "sandbox" = test cards, no real money. "manual" = clients send money to the card below and an admin confirms it by hand.
      - key: PAYMENT_PROVIDER
        value: manual
      # Optional: online card payment through Whop (README "Online payment through Whop"). Empty = no Whop button.
      # Set these in the Render dashboard, never in git.
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_ACCOUNT_ID
        sync: false
      - key: WHOP_WEBHOOK_SECRET
        sync: false
      - key: WHOP_PRODUCT_ID
        sync: false
      # Only used when PAYMENT_PROVIDER is "manual": where clients send the money. Set these in the Render dashboard, never in git.
      - key: MANUAL_PAY_CARD
        sync: false
      - key: MANUAL_PAY_HOLDER
        sync: false
      - key: MANUAL_PAY_BANK
        sync: false
      # The site's public address. Canonical links, sitemap, robots.txt, Open Graph and llms.txt are all built from it, so
      # moving to a real domain later means changing this one line (README "Search and AI visibility").
      - key: APP_URL
        value: https://tarmoq-uz.onrender.com
      # Optional: the verification codes Google Search Console and Yandex Webmaster give the owner. Empty = nothing is added to the pages.
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: YANDEX_VERIFICATION
        sync: false
      # Optional: "Continue with Google" (README "Sign in with Google"). Both empty = no Google button. The secret is never in git.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: email for password reset and address confirmation (resend.com). Both empty = those features stay hidden.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SESSION_MAX_AGE_DAYS
        value: "7"
      # Uploads are buffered in memory and a free instance has 512 MB, so keep videos short (Supabase's free limit is 50 MB anyway).
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
